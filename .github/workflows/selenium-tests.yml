name: Demo Web Shop Automation CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run Selenium Cucumber Tests
    runs-on: windows-latest  # Windows runner

    strategy:
      matrix:
        browser: [chrome]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache WebDriver Manager
        uses: actions/cache@v4
        with:
          path: ~/.cache/webdrivermanager
          key: ${{ runner.os }}-webdrivermanager

      # Install Chrome explicitly (this action works)
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      # Verify Chrome can launch headlessly
      - name: Test Chrome headless mode
        run: |
          google-chrome --headless --disable-gpu --no-sandbox --dump-dom https://www.example.com/ || echo "Chrome failed to start"

      - name: Display versions
        run: |
          java -version
          mvn --version
          google-chrome --version

      # Run tests with Chrome headless arguments
      - name: Run Selenium Tests
        run: mvn clean test
        env:
          BROWSER: ${{ matrix.browser }}
          CI: true
          HEADLESS: false
          # Additional Chrome arguments for headless mode on CI
          CHROME_OPTIONS: "--headless --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1920,1080"

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}-${{ github.run_number }}
          path: test-output/ExtentReports/*.html
          retention-days: 30

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            target/cucumber-reports/
            target/cucumber-html-reports/
          retention-days: 30

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_number }}
          path: test-output/Screenshots/
          retention-days: 14