name: Demo Web Shop Automation CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run Selenium Cucumber Tests
    runs-on: ubuntu-latest
    container: node:20

    strategy:
      matrix:
        browser: [chrome]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          node-version: '20'
          distribution: 'temurin'


      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache WebDriver Manager
        uses: actions/cache@v4
        with:
          path: ~/.cache/webdrivermanager
          key: ${{ runner.os }}-webdrivermanager

      # Install Chrome explicitly (this action works)
      - name: Install Chrome (latest)
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq && apt-get install -y -qq chromium-browser firefox-esr unzip



      # Verify Chrome can launch headlessly
      - name: Test Chrome headless mode
        run: |
          google-chrome --headless --disable-gpu --no-sandbox --dump-dom https://www.example.com/ || echo "Chrome failed to start"

      - name: Display versions
        run: |
          java -version
          mvn --version
          google-chrome --version

      # Run tests with Chrome headless arguments
      - name: Run Selenium Tests
        run: mvn clean test
        env:
          BROWSER: ${{ matrix.browser }}
          CI: true
          HEADLESS: true
          # Additional Chrome arguments for headless mode on CI
          CHROME_OPTIONS: "--headless --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1920,1080"

      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}-${{ github.run_number }}
          path: test-output/ExtentReports/*.html
          retention-days: 30

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.browser }}-${{ github.run_number }}
          path: |
            target/cucumber-reports/
            target/cucumber-html-reports/
          retention-days: 30

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_number }}
          path: test-output/Screenshots/
          retention-days: 15